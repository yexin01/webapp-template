[project]
name = "app-api"
version = "0.1.0"
description = "Python API for SaaS Template"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.143,<0.144",
  "pydantic>=2.14,<3",
  "pydantic-settings>=2.15,<3",
  "psycopg[binary]>=3.3,<3.4",
  "psycopg-pool>=3.3,<3.4",
  "pyjwt[crypto]>=2.15,<3",
  "httpx>=0.28,<0.29",
  "stripe>=16,<17",
  "sentry-sdk[fastapi]>=2.72,<3",
  "posthog>=7.68,<8",
  "svix>=2.8,<3",
]

[dependency-groups]
dev = [
  "uvicorn[standard]>=0.54,<0.55",
  "pytest>=9.1,<10",
  "ruff>=0.17,<0.18",
  "mypy>=2.4,<3",
  "import-linter>=2.15,<3",
  "pip-audit>=2.10,<3",
  "squawk-cli==2.70.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "db: requires a PostgreSQL test database (TEST_DATABASE_URL)",
  "sandbox: calls the Stripe test mode with a real key; skipped unless STRIPE_SANDBOX_TESTS=1 (tests/sandbox)",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "SIM", "RUF", "N", "C4", "PT", "RET"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311", "S608", "E501"]
# Router factories define FastAPI dependency aliases (``Personal = Annotated[...]``)
# as local, capitalized type aliases.
"app/modules/*/routes.py" = ["N806"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["svix.*", "posthog.*"]
ignore_missing_imports = true

[tool.importlinter]
root_package = "app"
include_external_packages = true

# Architecture contracts (ADR-0003). tests/architecture adds the cross-module rule:
# a module may import another module only through that module's `api`.

[[tool.importlinter.contracts]]
name = "The kernel never depends on feature modules or the composition root"
type = "forbidden"
source_modules = ["app.kernel"]
forbidden_modules = ["app.modules", "app.bootstrap", "app.settings", "app.cli"]

[[tool.importlinter.contracts]]
name = "Kernel core is framework-free"
type = "forbidden"
source_modules = [
  "app.kernel.errors", "app.kernel.tenancy", "app.kernel.authorization", "app.kernel.events",
  "app.kernel.pagination", "app.kernel.ports", "app.kernel.diagnostics", "app.kernel.jobs",
  "app.kernel.webhooks", "app.kernel.application",
]
forbidden_modules = [
  "app.kernel.infrastructure", "app.kernel.http", "app.kernel.wiring",
  "fastapi", "starlette", "psycopg", "psycopg_pool", "stripe", "httpx", "sentry_sdk", "posthog", "jwt", "svix",
]

[[tool.importlinter.contracts]]
name = "Kernel infrastructure does not depend on the HTTP layer"
type = "forbidden"
source_modules = ["app.kernel.infrastructure"]
forbidden_modules = ["app.kernel.http", "app.kernel.wiring", "app.kernel.application"]

[[tool.importlinter.contracts]]
name = "Every module follows the same layers"
type = "layers"
containers = ["app.modules.*"]
layers = [
  "module",
  "(settings) | (api)",
  "routes | (adapters) | (probe)",
  "service",
  "(ports)",
  "domain",
]
exhaustive = true

[[tool.importlinter.contracts]]
name = "Module domains are pure"
type = "forbidden"
source_modules = ["app.modules.*.domain"]
forbidden_modules = [
  "app.kernel.infrastructure", "app.kernel.http", "app.kernel.wiring", "app.kernel.application",
  "fastapi", "starlette", "pydantic", "psycopg", "stripe", "httpx", "sentry_sdk", "posthog", "jwt", "svix",
]

[[tool.importlinter.contracts]]
name = "Module services, ports, and probes use no frameworks, SDKs, or adapters"
type = "forbidden"
source_modules = ["app.modules.*.service", "app.modules.*.ports", "app.modules.*.probe"]
forbidden_modules = [
  "app.kernel.infrastructure", "app.kernel.http", "app.kernel.wiring",
  "fastapi", "starlette", "psycopg", "stripe", "httpx", "sentry_sdk", "posthog", "jwt", "svix",
]

[[tool.importlinter.contracts]]
name = "Module routes use no vendor SDKs or infrastructure"
type = "forbidden"
source_modules = ["app.modules.*.routes"]
forbidden_modules = ["app.kernel.infrastructure", "psycopg", "stripe", "posthog", "svix", "jwt", "sentry_sdk", "httpx"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Modules do not form import cycles"
type = "acyclic_siblings"
ancestors = ["app.modules"]

[tool.uv]
# Flat layout imported from the project directory; no build or install step.
package = false
