# Secret scanning configuration (SEC-05), used in CI and by the pre-commit
# hook (scripts/git-hooks/pre-commit). Extends the default rules.
# The allowlist is deliberately narrow: values that are synthetic canaries or
# placeholders, which never grant access, wherever they appear. There are no
# path exemptions for tests: a synthetic test value carries one of the
# markers below (for example `sk_test_only_...`) so a real key pasted into a
# test is still caught.
[extend]
useDefault = true

[allowlist]
description = "Synthetic test fixtures and documented placeholders"
paths = [
  # Lists fingerprints of reviewed findings; contains no secrets.
  '''(^|/)\.gitleaksignore$''',
]
regexes = [
  '''(?i)(placeholder|replace_me|canary|not_a_real_secret|test_only)''',
  # A reference to an environment variable is a name, never its value.
  '''^(?:globalThis\.)?process\.env\.[A-Z][A-Z0-9_]*$''',
  # The unsigned canary JWTs in apps/api/tests/unit/test_adapters.py and
  # apps/web/src/sentry-config.test.ts, exactly: {"alg":"RS256"} with
  # {"sub":"canary"} or {"sub":"CANARY"}, signed "signaturecanary" or
  # "signatureCANARY". Base64 hides the marker, so they are listed by value.
  '''^eyJhbGciOiJSUzI1NiJ9\.(?:eyJzdWIiOiJjYW5hcnkifQ\.c2lnbmF0dXJlY2FuYXJ5|eyJzdWIiOiJDQU5BUlkifQ\.c2lnbmF0dXJlQ0FOQVJZ)$''',
  # Publishable keys (Clerk, Stripe) are public by design: browsers receive them.
  '''^pk_(?:test|live)_[A-Za-z0-9+/=]+$''',
  # The JWT header {"alg":"RS256"} on its own, which tests concatenate with a canary payload and
  # signature. A header carries no credential.
  '''^eyJhbGciOiJSUzI1NiJ9\.?$''',
  # History only: the API tests' synthetic values before they carried the
  # test_only marker (tests/unit/test_config.py, tests/integration/
  # test_outbox_jobs.py), exactly. Keeps full-history scans clean.
  '''^(?:sk_test_abcdefghijklmnop|cron-test-secret-0123456789abcdef0123)$''',
]
