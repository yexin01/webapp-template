name: Feature request
description: Propose an improvement to the template.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: Problem, description: What need does this address for adopters? }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposal, description: Note any new infrastructure, cost, or security impact. }
    validations: { required: true }
