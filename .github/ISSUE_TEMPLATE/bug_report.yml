name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "**Do not report security vulnerabilities here.** Follow SECURITY.md instead. Never paste keys, tokens, or personal data."
  - type: textarea
    id: what
    attributes: { label: What happened, description: Include the request ID (X-Request-ID) if relevant. }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: What you expected }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: Commit or version }
