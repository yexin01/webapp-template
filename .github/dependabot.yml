version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: uv
    directory: /apps/api
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  # The postgres image in docker-compose.yml. Dependabot does not update the
  # services images in .github/workflows/ci.yml (github-actions covers only
  # `uses:` references), so bump those by hand to the same tag.
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: monthly }
