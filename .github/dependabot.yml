version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # @types/node describes the Node major the apps run (.nvmrc). Its major moves with the runtime, by hand:
      # types for a newer Node would accept APIs that Node 24 does not have.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 and ESLint 10 wait for the lint toolchain (owner, 2026-11-07): typescript-eslint supports
      # TypeScript below 6.1, and eslint-plugin-react, eslint-plugin-import and eslint-plugin-jsx-a11y declare
      # ESLint 9 at most. Remove a rule once those packages support the new major.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: uv
    directory: /apps/api
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      # init and analyze must run the same version of the action ("Loaded a configuration file for version 4.39.1,
      # but running version 4.38.3" failed all three CodeQL jobs of the first single-action pull request).
      codeql-action:
        patterns: ["github/codeql-action/*"]
  # The postgres image in docker-compose.yml. Dependabot does not update the
  # services images in .github/workflows/ci.yml (github-actions covers only
  # `uses:` references), so bump those by hand to the same tag.
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: monthly }
    ignore:
      # The local database runs Supabase's PostgreSQL major (17, `pnpm test:supabase`). A major moves with
      # Supabase, by hand, together with the CI service images; its data directory does not carry over.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
