version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: uv
    directory: /apps/api
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      # init and analyze must run the same version of the action ("Loaded a configuration file for version 4.39.1,
      # but running version 4.38.3" failed all three CodeQL jobs of the first single-action pull request).
      codeql-action:
        patterns: ["github/codeql-action/*"]
  # The postgres image in docker-compose.yml. Dependabot does not update the
  # services images in .github/workflows/ci.yml (github-actions covers only
  # `uses:` references), so bump those by hand to the same tag.
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: monthly }
