# Required checks (spec §16.1). No job in this workflow receives secrets, so
# it is safe for pull requests from forks (CI-SEC-03).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A push to main is a record of the main branch: a later push does not cancel its checks.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_FROZEN: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  api:
    name: API — lint, types, tests, audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        # Keep in step with docker-compose.yml. Dependabot updates that file
        # (docker-compose ecosystem) but not service images in workflows.
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.1"
      # The perf harness tests run perf/k6/summary.mjs with Node.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
      - run: uv sync --frozen
      - name: Lint and format
        run: |
          uv run ruff check app tests index.py ../../perf
          uv run ruff format --check app tests index.py ../../perf
      - name: Import boundaries
        run: uv run lint-imports
      - name: Migration lint (MIG-03)
        run: uv run squawk --config ../../.squawk.toml ../../supabase/migrations/*.sql
      - name: Type check (strict)
        run: uv run mypy
      - name: Tests (unit, integration, RLS, security, resilience)
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app
        run: uv run pytest
      - name: Migrations apply cleanly to an empty database
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app
        run: |
          uv run python -m app.cli migrate
          uv run python -m app.cli migrate
      - name: Dependency audit (locked versions)
        run: sh ../../scripts/pip-audit-locked.sh

  api-supabase:
    # Supabase's Postgres image: `postgres` is not a superuser there, supautils guards role changes, and the
    # client roles exist with default grants (local provider-image evidence; not a hosted project).
    name: API — Supabase Postgres image
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.1"
      # The perf harness tests run perf/k6/summary.mjs with Node.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
      - run: uv sync --frozen
        working-directory: apps/api
      - name: Migrations, privileges, login role, and database tests on the image
        run: node scripts/test-supabase-image.mjs

  web:
    name: Web — lint, types, tests, build, e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        # Keep in step with docker-compose.yml. Dependabot updates that file
        # (docker-compose ecosystem) but not service images in workflows.
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.1"
      - run: pnpm install --frozen-lockfile
      - run: pnpm api:sync
      - name: Format check
        run: pnpm --filter web format:check
      - run: pnpm --filter web lint
      - run: pnpm --filter web typecheck
      - run: pnpm --filter web test
      - name: API contracts are up to date
        run: pnpm contracts:check
      - name: Template initialization leaves no original identifiers (REPO-07)
        run: pnpm test:init-template
      - name: Community contacts are filled in once the project is renamed (DEC-012)
        run: pnpm check:placeholders
      - name: Module generator produces a module that passes every gate (ADR-0003)
        run: pnpm test:new-module
      - name: Production build (placeholder public key; no secrets)
        run: |
          export NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY="pk_test_$(printf 'placeholder.clerk.accounts.dev$' | base64)"
          pnpm build
      - name: No server-only values in the browser bundle
        run: |
          node scripts/check-bundle-secrets.mjs --self-test
          pnpm check:bundle-secrets
      # Any severity, matching pip-audit, which has no severity filter. Scope
      # and reasons: scripts/security-audit.mjs.
      - name: Dependency audit (production)
        run: pnpm audit --prod
      - name: License compliance (allowlist)
        run: |
          node scripts/check-licenses.mjs --self-test
          pnpm security:licenses
      - name: End-to-end (account-free checks)
        run: |
          pnpm --filter web exec playwright install --with-deps chromium
          pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  deploy-config:
    # Spec 16.1 "Deployment configuration": builds the root vercel.json with the pinned Vercel
    # CLI and checks the output. No Vercel account, token, or deployment; local packaging
    # evidence only (docs-notes/deploy.md says what a preview deployment must still show).
    name: Deployment configuration — vercel build, no deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERCEL_TELEMETRY_DISABLED: "1"
      NO_UPDATE_NOTIFIER: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.1"
      - run: pnpm install --frozen-lockfile
      - name: Production dependencies import as Vercel installs them (no dev group)
        run: |
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/api-prod" uv sync --project apps/api --frozen --no-dev --no-install-project
          cd apps/api
          APP_ENV=test DATABASE_URL=postgresql://app:unused@127.0.0.1:1/unused \
            "$RUNNER_TEMP/api-prod/bin/python" -I -c 'import sys; sys.path.insert(0, "."); import index, app.cli'
      - name: Build-output checks catch planted defects
        run: |
          "$RUNNER_TEMP/api-prod/bin/python" scripts/check_vercel_build.py self-test
          node scripts/check-bundle-secrets.mjs --self-test
      - name: vercel build against the root vercel.json
        env:
          VERCEL_BUILD_PYTHON: ${{ runner.temp }}/api-prod/bin/python
        run: pnpm test:vercel-build

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # The gitleaks CLI needs no license (the gitleaks-action does for organization repositories)
      # and runs on pull requests from forks. Keep the version in step with the image digest in
      # scripts/git-hooks/pre-commit. Dependabot does not read either pin.
      GITLEAKS_VERSION: "8.30.1"
      # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's gitleaks_8.30.1_checksums.txt.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned release, checksum verified)
        run: |
          set -eu
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict -
          mkdir "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - name: The scanner flags a planted secret (self-test)
        run: |
          set -eu
          planted="$(mktemp -d)"
          printf 'aws_access_key_id = "AKIA%s"\n' "$(openssl rand -base64 96 | tr -dc 'A-Z2-7' | head -c 16)" > "$planted/planted.env"
          if gitleaks dir "$planted" --config .gitleaks.toml --redact --no-banner; then
            echo "::error::gitleaks did not flag a planted secret, so a clean scan would mean nothing."
            exit 1
          fi
      - name: Scan the full history reachable from this commit
        run: gitleaks git --config .gitleaks.toml --log-opts="--full-history HEAD" --redact --no-banner .
