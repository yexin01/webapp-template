# Required checks (spec §16.1). No job in this workflow receives secrets, so
# it is safe for pull requests from forks (CI-SEC-03).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  api:
    name: API — lint, types, tests, audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        # Keep in step with docker-compose.yml. Dependabot updates that file
        # (docker-compose ecosystem) but not service images in workflows.
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.1"
      # The perf harness tests run perf/k6/summary.mjs with Node.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
      - run: uv sync --frozen
      - name: Lint and format
        run: |
          uv run ruff check app tests index.py ../../perf
          uv run ruff format --check app tests index.py ../../perf
      - name: Import boundaries
        run: uv run lint-imports
      - name: Migration lint (MIG-03)
        run: uv run squawk --config ../../.squawk.toml ../../supabase/migrations/*.sql
      - name: Type check (strict)
        run: uv run mypy
      - name: Tests (unit, integration, RLS, security, resilience)
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app
        run: uv run pytest
      - name: Migrations apply cleanly to an empty database
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app
        run: |
          uv run python -m app.cli migrate
          uv run python -m app.cli migrate
      - name: Dependency audit (locked versions)
        run: sh ../../scripts/pip-audit-locked.sh

  web:
    name: Web — lint, types, tests, build, e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        # Keep in step with docker-compose.yml. Dependabot updates that file
        # (docker-compose ecosystem) but not service images in workflows.
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.1"
      - run: pnpm install --frozen-lockfile
      - run: pnpm api:sync
      - name: Format check
        run: pnpm --filter web format:check
      - run: pnpm --filter web lint
      - run: pnpm --filter web typecheck
      - run: pnpm --filter web test
      - name: API contracts are up to date
        run: pnpm contracts:check
      - name: Template initialization leaves no original identifiers (REPO-07)
        run: pnpm test:init-template
      - name: Community contacts are filled in once the project is renamed (DEC-012)
        run: pnpm check:placeholders
      - name: Module generator produces a module that passes every gate (ADR-0003)
        run: pnpm test:new-module
      - name: Production build (placeholder public key; no secrets)
        run: |
          export NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY="pk_test_$(printf 'placeholder.clerk.accounts.dev$' | base64)"
          pnpm build
      - name: No server-only values in the browser bundle
        run: |
          node scripts/check-bundle-secrets.mjs --self-test
          pnpm check:bundle-secrets
      # Any severity, matching pip-audit, which has no severity filter. Scope
      # and reasons: scripts/security-audit.mjs.
      - name: Dependency audit (production)
        run: pnpm audit --prod
      - name: License compliance (allowlist)
        run: |
          node scripts/check-licenses.mjs --self-test
          pnpm security:licenses
      - name: End-to-end (account-free checks)
        run: |
          pnpm --filter web exec playwright install --with-deps chromium
          pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # On pull requests the action lists the pull request's commits through the
    # API, which needs pull-requests: read on private repositories.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      # Repositories owned by an organization need a free gitleaks-action
      # license: store it as the GITLEAKS_LICENSE secret and pass it below as
      # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }} (an owner action).
      # Personal repositories do not. Pull requests from forks never receive
      # secrets, so in an organization this step fails on fork pull requests
      # unless it is replaced by the gitleaks CLI, which needs no license.
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Review comments would need pull-requests: write. Findings go to the
          # job log, summary, and a redacted SARIF artifact instead.
          GITLEAKS_ENABLE_COMMENTS: "false"
