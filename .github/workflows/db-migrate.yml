# Applies pending migrations to a hosted database (MIG-05). Manual only: it never
# runs on push or pull request, so merging changes no database by itself.
#
# Owner setup (docs/deployment.md#set-up-github): create the GitHub Environments `preview` and
# `production`, make yourself a required reviewer on `production` (it can hold the
# run until you approve), allow deployments from the default branch only, and store
# each environment's own MIGRATION_DATABASE_URL secret: the migration role's
# Supabase session pooler string. Preview and production credentials stay apart.
#
# Run it from the default branch, once the code that needs the migrations is merged
# and before it is promoted. Never apply an unmerged branch's migrations to a shared
# database: once a later version is recorded, every earlier-numbered migration is refused.
name: Database migrate

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment whose MIGRATION_DATABASE_URL secret names the database
        type: choice
        required: true
        options: [preview, production]

permissions:
  contents: read

concurrency:
  group: db-migrate-${{ inputs.environment }}
  cancel-in-progress: false

env:
  # The migration runner needs the API's runtime dependencies only, exactly as locked.
  UV_LOCKED: "1"
  UV_NO_DEV: "1"

jobs:
  migrate:
    name: migrate (${{ inputs.environment }})
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.1"
      - run: uv sync --locked --no-dev
        working-directory: apps/api
      - name: Check that the environment has a database secret
        env:
          TARGET: ${{ inputs.environment }}
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: |
          if [ -z "$MIGRATION_DATABASE_URL" ]; then
            echo "::error::The $TARGET environment has no MIGRATION_DATABASE_URL secret."
            exit 1
          fi
      - name: Apply migrations
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: pnpm db:migrate --allow-remote
